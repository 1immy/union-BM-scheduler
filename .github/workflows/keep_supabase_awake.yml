# Keeps the free-tier Supabase project from pausing after a week of no traffic.
# Sends one tiny read request every 3 days. Safe to run by hand too (Actions tab > Run workflow).
# Note: GitHub switches scheduled workflows off after 60 days with no commits to the repo.
# If that happens, re-enable it from the Actions tab (or make any small commit).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: |
          curl -fsS --retry 3 --retry-delay 15 --max-time 30 \
            "https://cnbdufqfrlgalzxxrmml.supabase.co/rest/v1/week_config?select=id&limit=1" \
            -H "apikey: sb_publishable_ea6eMZwUuKBbgJ8B7BvMzg_LK3X3f2d" \
            -o /dev/null
          echo "Supabase responded OK"
